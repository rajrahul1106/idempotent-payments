name: idempotent-payments

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5433:5432"  # host 5433, because 5432 belongs to another project
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redpanda is Kafka-protocol compatible and runs as a single container
  # with no ZooKeeper or KRaft setup. Blueprint section 6.
  #
  # Memory: with --memory 1G and no limit it was OOM-killed twice when the
  # 4 GB Docker VM ran out under load, and with no restart policy it stayed
  # down. Seastar now gets 512M; mem_limit sits a little above it (768m) so
  # the container limit never kills the broker before Seastar's own
  # allocator has had a chance to work. unless-stopped: a crash or an OOM
  # restarts it, a manual `docker stop` (the chaos tests) keeps it down.
  # Its data volume survives a restart, and every client reconnects.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    mem_limit: 768m
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      # Nothing held back for the OS: mem_limit, not Seastar, is the ceiling.
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
      # Topics come only from topic_setup, with the partition count the
      # system relies on. Auto-create once made payments.main with 1 partition.
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.healthcheck", "--url", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Exactly one relay instance (blueprint decision D1). Two relays could
  # each claim a batch and publish one account's events out of order.
  relay:
    build: .
    command: python -m app.messaging.relay
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: creates payments.main (6 partitions), the retry tiers and the
  # DLQ topic. Idempotent; exits non-zero if a topic has the wrong
  # partition count, which stops the relay and consumer from starting.
  topics:
    build: .
    command: python -m app.messaging.topic_setup
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  consumer:
    build: .
    command: python -m app.messaging.consumer
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    # A failed message goes to a retry tier or the DLQ and the consumer moves
    # on (decision D5). It exits only on a fatal broker error.
    restart: unless-stopped

  # One consumer per retry tier (blueprint §5.4). Each holds a message until
  # its delay has passed, then returns it to payments.main. They never touch
  # the database. Delays come from RETRY_TIER_SECONDS (default 5,60,600).

  retry-5s:
    build: .
    command: python -m app.messaging.retry_tier 0
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  retry-1m:
    build: .
    command: python -m app.messaging.retry_tier 1
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  retry-10m:
    build: .
    command: python -m app.messaging.retry_tier 2
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  # Persists every payments.dlq message to dlq_messages, once.
  dlq-writer:
    build: .
    command: python -m app.messaging.dlq_writer
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  # The four invariant checks (I1 to I4) every RECONCILIATION_INTERVAL_SECONDS
  # (default 300), each result written to reconciliation_runs. Also keeps the
  # outbox and consumer-lag gauges current, so they survive the processes
  # they watch.
  reconciliation:
    build: .
    command: python -m app.services.reconciliation
    healthcheck:
      test: ["CMD", "python", "-m", "app.core.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  # Scrapes every process (monitoring/prometheus/prometheus.yml) and
  # evaluates monitoring/prometheus/alerts.yml. No Alertmanager: alerts show
  # at http://localhost:9090/alerts.
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    # Datasources and dashboards are provisioned from monitoring/grafana; the
    # order matters only so the first dashboard load finds Prometheus ready.
    depends_on:
      prometheus:
        condition: service_healthy

  # In-memory trace store. Uncapped, it grew with every span and was
  # OOM-killed during the Phase 7b load drill (12,000 payments, ~20 spans
  # each); capped at 20,000 traces it still restarted under load. Now:
  #   MEMORY_MAX_TRACES  the store keeps the newest 5,000 traces (~100,000 spans)
  #   GOMEMLIMIT         Go's soft limit: the collector frees memory before...
  #   mem_limit          ...the hard limit, which also keeps it from starving
  #                      the rest of the stack.
  # Sampling stays at 100%; under load the oldest traces are evicted first.
  # Exporting is off the request path, so a Jaeger restart never affects a
  # payment.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "5000"
      GOMEMLIMIT: "400MiB"
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  pgdata:
