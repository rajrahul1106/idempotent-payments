name: idempotent-payments

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5433:5432"  # host 5433, because 5432 belongs to another project
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redpanda is Kafka-protocol compatible and runs as a single container
  # with no ZooKeeper or KRaft setup. Blueprint section 6.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
      # Topics come only from topic_setup, with the partition count the
      # system relies on. Auto-create once made payments.main with 1 partition.
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Exactly one relay instance (blueprint decision D1). Two relays could
  # each claim a batch and publish one account's events out of order.
  relay:
    build: .
    command: python -m app.messaging.relay
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: creates payments.main (6 partitions), the retry tiers and the
  # DLQ topic. Idempotent; exits non-zero if a topic has the wrong
  # partition count, which stops the relay and consumer from starting.
  topics:
    build: .
    command: python -m app.messaging.topic_setup
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  consumer:
    build: .
    command: python -m app.messaging.consumer
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    # A failed message goes to a retry tier or the DLQ and the consumer moves
    # on (decision D5). It exits only on a fatal broker error.
    restart: unless-stopped

  # One consumer per retry tier (blueprint §5.4). Each holds a message until
  # its delay has passed, then returns it to payments.main. They never touch
  # the database. Delays come from RETRY_TIER_SECONDS (default 5,60,600).

  retry-5s:
    build: .
    command: python -m app.messaging.retry_tier 0
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  retry-1m:
    build: .
    command: python -m app.messaging.retry_tier 1
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  retry-10m:
    build: .
    command: python -m app.messaging.retry_tier 2
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  # Persists every payments.dlq message to dlq_messages, once.
  dlq-writer:
    build: .
    command: python -m app.messaging.dlq_writer
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    depends_on:
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  pgdata:
