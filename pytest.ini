[pytest]
testpaths = tests
python_files = test_*.py
markers =
    integration: needs a live PostgreSQL
    messaging: needs a live Kafka or Redpanda
    chaos: long-running failure injection
    property: Hypothesis state machine, 200 examples (make test-property)
addopts = -q --strict-markers
# Zero warnings: any warning fails the run, so a deprecation is fixed when
# it appears rather than found later.
filterwarnings = error
