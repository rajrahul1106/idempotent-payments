# Prometheus scrape configuration, mounted at /etc/prometheus by
# docker-compose.yml.
#
# Until Phase 7 adds /metrics to the API and the relay, Prometheus scrapes
# only itself, so it starts cleanly with no target reported down. Phase 7
# adds the api and relay jobs here.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
