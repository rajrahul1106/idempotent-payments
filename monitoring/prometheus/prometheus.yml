# Prometheus configuration, mounted at /etc/prometheus by docker-compose.yml.
#
# Every process exposes its own /metrics: the API on its HTTP port, every
# other process on METRICS_PORT (9100) inside its own container. Outbox
# depth and consumer lag come from the reconciliation job, not from the relay
# or the consumer, so they stay visible while those are down.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alerts.yml  # relative to this file

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: relay
    static_configs:
      - targets: ["relay:9100"]

  - job_name: consumer
    static_configs:
      - targets: ["consumer:9100"]

  - job_name: retry-5s
    static_configs:
      - targets: ["retry-5s:9100"]

  - job_name: retry-1m
    static_configs:
      - targets: ["retry-1m:9100"]

  - job_name: retry-10m
    static_configs:
      - targets: ["retry-10m:9100"]

  - job_name: dlq-writer
    static_configs:
      - targets: ["dlq-writer:9100"]

  - job_name: reconciliation
    static_configs:
      - targets: ["reconciliation:9100"]
