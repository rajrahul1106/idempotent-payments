name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # The suite creates payments_test on this server and runs migrations itself.
      TEST_DATABASE_URL: postgresql+psycopg://payments:payments@localhost:5433/payments_test
      # Nothing in this job may reach a broker: point Kafka at a closed port.
      KAFKA_BOOTSTRAP_SERVERS: localhost:1
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies
        run: |
          pip install --no-deps -r requirements.lock
          pip check

      - name: Static checks
        run: make check

      - name: Unit tests
        run: make test-fast

      - name: Integration, API and concurrency tests (PostgreSQL)
        # Everything in `make test` except tests/unit (run above) and the 26
        # tests marked messaging, which need Kafka and run locally with
        # `make test`; see "Continuous integration" in the README.
        run: pytest -m "not messaging and not property and not chaos" --ignore=tests/unit
